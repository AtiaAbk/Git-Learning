buntu,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="middle" >Long-lived branches</text><text x="172" y="190" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="middle" >High complexity</text><g><circle cx="172" cy="214" r="5" fill="#0d1117" stroke="url(#g-orange)" stroke-width="3.5"/><circle cx="172" cy="214" r="2.1" fill="url(#g-orange)"/></g></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4.0s" repeatCount="indefinite"/><rect x="345" y="30" width="285" height="200" rx="18" fill="#0d1117" stroke="#388bfd" stroke-width="2"/><rect x="345" y="30" width="285" height="8" rx="4" fill="url(#g-blue)"/><text x="487" y="78" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" >GitHub Flow</text><text x="487" y="104" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#79c0ff" text-anchor="middle" >Continuous delivery</text><path d="M385 130H590" stroke="#388bfd" stroke-opacity="0.5"/><text x="487" y="160" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="middle" >Branch, PR, merge, deploy</text><text x="487" y="190" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="middle" >Low complexity</text><g><circle cx="487" cy="214" r="5" fill="#0d1117" stroke="url(#g-blue)" stroke-width="3.5"/><circle cx="487" cy="214" r="2.1" fill="url(#g-blue)"/></g></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4.5s" repeatCount="indefinite"/><rect x="660" y="30" width="285" height="200" rx="18" fill="#0d1117" stroke="#2ea043" stroke-width="2"/><rect x="660" y="30" width="285" height="8" rx="4" fi