offset="0" stop-color="#7ff5ee"/><stop offset="1" stop-color="#1fb6b0"/></linearGradient><marker id="m-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1fb6b0"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="0.55" stop-color="#151b2b"/><stop offset="1" stop-color="#1c1633"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur40" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/></pattern></defs><defs><linearGradient id="dl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f05032" stop-opacity="0"/><stop offset="0.25" stop-color="#f05032"/><stop offset="0.5" stop-color="#8957e5"/><stop offset="0.75" stop-color="#388bfd"/><stop offset="1" stop-color="#388bfd" stop-opacity="0"/></linearGradient></defs><rect x="40" y="13" width="920" height="3" rx="1.5" fill="url(#dl)"/><circle r="5" cy="14.5" fill="#fff" filter="url(#glow)"><animate attributeName="cx" values="40;960;40" dur="7s" repeatCount="indefinite"/></circle><circle cx="500" cy="14.5" r="8" fill="#0d1117" stroke="#8957e5" stroke-width="3"><animate attributeName="r" values="8;10;8" dur="2.5s" repeatCount="indefinite"/></circle></svg>