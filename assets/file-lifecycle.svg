offset="0" stop-color="#7ff5ee"/><stop offset="1" stop-color="#1fb6b0"/></linearGradient><marker id="m-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1fb6b0"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="0.55" stop-color="#151b2b"/><stop offset="1" stop-color="#1c1633"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur40" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/></pattern></defs><rect width="1000" height="290" rx="20" fill="url(#bg)"/><rect width="1000" height="290" rx="20" fill="url(#dots)"/><rect x="0.5" y="0.5" width="999" height="289" rx="20" fill="none" stroke="#30363d"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" begin="0s" repeatCount="indefinite"/><rect x="30" y="100" width="205" height="90" rx="14" fill="#161b22" stroke="url(#g-pink)" stroke-width="2"/><rect x="30" y="100" width="205" height="6" rx="3" fill="url(#g-pink)"/><text x="132.5" y="147.0" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >Untracked</text><text x="132.5" y="169.0" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="middle" >new file</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" begin="0s" repeatCount="indefinite"/><rect x="275" y="100" width="205" height="90" rx="14" fill="#161b22" stroke="url(#g-blue)" stroke-width="2"/><rect x="275" y="100" width="205" height="6" rx="3" fill="url(#g-blue)"/><text x="377.5" y="147.0" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >Staged</text><text x="377.5" y="169.0" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="middle" >in the index</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" begin="0s" repeatCount="indefinite"/><rect x="520" y="100" width="205" height="90" rx="14" fill="#161b22" stroke="url(#g-green)" stroke-width="2"/><rect x="520" y="100" width="205" height="6" rx="3" fill="url(#g-green)"/><text x="622.5" y="147.0" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >Committed</text><text x="622.5" y="169.0" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="middle" >unmodified</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" begin="0s" repeatCount="indefinite"/><rect x="765" y="100" width="205" height="90" rx="14" fill="#161b22" stroke="url(#g-amber)" stroke-width="2"/><rect x="765" y="100" width="205" height="6" rx="3" fill="url(#g-amber)"/><text x="867.5" y="147.0" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >Modified</text><text x="867.5" y="169.0" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="middle" >edited, not staged</text></g><path d="M235 145H273" fill="none" stroke="#db61a2" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round" marker-end="url(#m-pink)" opacity="0.9"><animate attributeName="stroke-da