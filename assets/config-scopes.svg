<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img"><title>Git config scopes</title><defs>
  <style>
    @media (prefers-color-scheme: light) {
      /* Base & Backgrounds */
      rect[fill="url(#bg)"], rect[fill="#0d1117"], rect[fill="#0a0d14"] { fill: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(1) { stop-color: #ffffff !important; }
      linearGradient#bg stop:nth-child(2) { stop-color: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(3) { stop-color: #edf2f7 !important; }
      pattern#dots circle { fill: #0969da !important; opacity: 0.07 !important; }

      /* Cards & Containers */
      rect[fill="#161b22"] { fill: #ffffff !important; stroke: #d0d7de !important; }
      rect[fill="#0d1117"] { fill: #f6f8fa !important; }
      rect[stroke="#30363d"] { stroke: #d0d7de !important; }
      line[stroke="#30363d"] { stroke: #d0d7de !important; }
      rect[stroke="#21262d"] { stroke: #d0d7de !important; }

      /* Typography */
      text[fill="#ffffff"], text[fill="#e6edf3"], text[fill="#f0f6fc"] { fill: #1f2328 !important; }
      text[fill="#8b949e"], text[fill="#c9d1d9"] { fill: #57606a !important; }
      text[fill="#7d8590"] { fill: #656d76 !important; }

      /* Node circles in diagrams */
      circle[fill="#0d1117"] { fill: #ffffff !important; }
      circle[fill="#161b22"] { fill: #ffffff !important; }
    }
  </style>
<linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a5c"/><stop offset="1" stop-color="#f05032"/></linearGradient><marker id="m-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f05032"/></marker><linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#79c0ff"/><stop offset="1" stop-color="#388bfd"/></linearGradient><marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#388bfd"/></marker><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ee787"/><stop offset="1" stop-color="#2ea043"/></linearGradient><marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2ea043"/></marker><linearGradient id="g-purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d2a8ff"/><stop offset="1" stop-color="#8957e5"/></linearGradient><marker id="m-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8957e5"/></marker><linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa6d5"/><stop offset="1" stop-color="#db61a2"/></linearGradient><marker id="m-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db61a2"/></marker><linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#e3a008"/></linearGradient><marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e3a008"/></marker><linearGradient id="g-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ff5ee"/><stop offset="1" stop-color="#1fb6b0"/></linearGradient><marker id="m-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1fb6b0"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="0.55" stop-color="#151b2b"/><stop offset="1" stop-color="#1c1633"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur40" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/></pattern></defs><rect width="1000" height="300" rx="20" fill="url(#bg)"/><rect width="1000" height="300" rx="20" fill="url(#dots)"/><rect x="0.5" y="0.5" width="999" height="299" rx="20" fill="none" stroke="#30363d"/><rect x="40" y="30" width="560" height="240" rx="18" fill="#2ea043" fill-opacity="0.12" stroke="#2ea043" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" begin="0s" repeatCount="indefinite"/></rect><text x="60" y="58" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#7ee787" text-anchor="start" >--system</text><text x="60" y="78" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >/etc/gitconfig · all users</text><rect x="90" y="92" width="460" height="168" rx="18" fill="#388bfd" fill-opacity="0.12" stroke="#388bfd" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" begin="0.5s" repeatCount="indefinite"/></rect><text x="110" y="120" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#79c0ff" text-anchor="start" >--global</text><text x="110" y="140" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >~/.gitconfig · all your repos</text><rect x="140" y="150" width="360" height="98" rx="18" fill="#f05032" fill-opacity="0.12" stroke="#f05032" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" begin="1s" repeatCount="indefinite"/></rect><text x="160" y="178" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#ff9a5c" text-anchor="start" >--local</text><text x="160" y="198" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >.git/config · this repo only</text><path d="M700 250V70" stroke="url(#g-orange)" stroke-width="4" stroke-linecap="round" marker-end="url(#m-orange)" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/></path><text x="730" y="70" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#ffa27a" text-anchor="start" >Highest priority</text><text x="730" y="255" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#7ee787" text-anchor="start" >Lowest priority</text><text x="730" y="160" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start" >Local overrides global,</text><text x="730" y="180" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start" >global overrides system.</text></svg>