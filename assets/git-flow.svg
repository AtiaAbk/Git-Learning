<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>Git Flow branching model</title><defs>
  <style>
    @media (prefers-color-scheme: light) {
      /* Base & Backgrounds */
      rect[fill="url(#bg)"], rect[fill="#0d1117"], rect[fill="#0a0d14"] { fill: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(1) { stop-color: #ffffff !important; }
      linearGradient#bg stop:nth-child(2) { stop-color: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(3) { stop-color: #edf2f7 !important; }
      pattern#dots circle { fill: #0969da !important; opacity: 0.07 !important; }

      /* Cards & Containers */
