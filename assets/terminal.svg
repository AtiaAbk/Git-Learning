<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img"><title>Terminal animation of the basic git workflow</title><defs><linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a5c"/><stop offset="1" stop-color="#f05032"/></linearGradient><marker id="m-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f05032"/></marker><linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#79c0ff"/><stop offset="1" stop-color="#388bfd"/></linearGradient><marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#388bfd"/></marker><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ee787"/><stop offset="1" stop-color="#2ea043"/></linearGradient><marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2ea043"/></marker><linearGradient id="g-purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d2a8ff"/><stop offset="1" stop-color="#8957e5"/></linearGradient><marker id="m-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8957e5"/></marker><linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa6d5"/><stop offset="1" stop-color="#db61a2"/></linearGradient><marker id="m-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#db61a2"/></marker><linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#e3a008"/></linearGradient><marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e3a008"/></marker><linearGradient id="g-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ff5ee"/><stop offset="1" stop-color="#1fb6b0"/></linearGradient><marker id="m-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1fb6b0"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="0.55" stop-color="#151b2b"/><stop offset="1" stop-color="#1c1633"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur40" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/></pattern></defs><rect width="1000" height="330" rx="16" fill="url(#bg)"/><rect width="1000" height="330" rx="16" fill="url(#dots)"/><rect x="0.5" y="0.5" width="999" height="329" rx="16" fill="none" stroke="#30363d"/><rect x="0" y="0" width="1000" height="44" rx="16" fill="#161b22"/><rect x="0" y="28" width="1000" height="16" fill="#161b22"/><circle cx="28" cy="22" r="7" fill="#ff5f56"/><circle cx="52" cy="22" r="7" fill="#ffbd2e"/><circle cx="76" cy="22" r="7" fill="#27c93f"/><text x="500" y="28" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="14" font-weight="500" fill="#8b949e" text-anchor="middle" >bash — ~/my-project</text><clipPath id="tc0"><rect x="40" y="64" width="0" height="30"><animate attributeName="width" values="0;0;107;107;0;0" keyTimes="0;0.040;0.120;0.93;0.98;1" dur="12.0s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#tc0)"><text x="40" y="84" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="20" font-weight="700" fill="#3fb950" text-anchor="start" >$</text><text x="66" y="84" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="20" font-weight="500" fill="#e6edf3" text-anchor="start" >git init</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.120;0.140;0.93;0.98;1" dur="12.0s" repeatCount="indefinite"/><text x="66" y="112" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#79c0ff" text-anchor="start" >Initialized empty Git repository in ~/my-project/.git/</text></g><clipPath id="tc1"><rect x="40" y="122" width="0" height="30"><animate attributeName="width" values="0;0;115;115;0;0" keyTimes="0;0.240;0.320;0.93;0.98;1" dur="12.0s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#tc1)"><text x="40" y="142" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="20" font-weight="700" fill="#3fb950" text-anchor="start" >$</text><text x="66" y="142" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="20" font-weight="500" fill="#e6edf3" text-anchor="start" >git add .</text></g><clipPath id="tc2"><rect x="40" y="156" width="0" height="30"><animate attributeName="width" values="0;0;324;324;0;0" keyTimes="0;0.440;0.520;0.93;0.98;1" dur="12.0s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#tc2)"><text x="40" y="176" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="20" font-weight="700" fill="#3fb950" text-anchor="start" >$</text><text x="66" y="176" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="20" font-weight="500" fill="#e6edf3" text-anchor="start" >git commit -m &quot;feat: hello world&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.520;0.540;0.93;0.98;1" dur="12.0s" repeatCount="indefinite"/><text x="66" y="204" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#79c0ff" text-anchor="start" >[main (root-commit) a1b2c3d] feat: hello world</text></g><clipPath id="tc3"><rect x="40" y="214" width="0" height="30"><animate attributeName="width" values="0;0;237;237;0;0" keyTimes="0;0.640;0.720;0.93;0.98;1" dur="12.0s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#tc3)"><text x="40" y="234" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="20" font-weight="700" fill="#3fb950" text-anchor="start" >$</text><text x="66" y="234" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="20" font-weight="500" fill="#e6edf3" text-anchor="start" >git push -u origin main</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.720;0.740;0.93;0.98;1" dur="12.0s" repeatCount="indefinite"/><text x="66" y="262" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#79c0ff" text-anchor="start" >Branch &#39;main&#39; set up to track remote branch &#39;main&#39; from &#39;origin&#39;.</text></g><rect x="66" y="274" width="11" height="22" fill="#e6edf3"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></svg>